name: PR Build & Test

on:
  pull_request:
  push:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Codecov OIDC authentication
    steps:
      - uses: actions/checkout@v1
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Update apt
        run: sudo apt update
      - name: Install dependencies
        # Same list as ci.yaml's ubuntu-latest leg, minus the GUI-only deps
        # (libgtk-3-dev, libglu1-mesa-dev) and libcurl4-openssl-dev — this
        # workflow builds the CLI + test suite only, not the GUI.
        run: sudo apt install -y libuv1-dev libargtable2-dev libserialport-dev libconfig-dev libhidapi-dev liblua5.4-dev libxdg-basedir-dev libxml2-dev libpulse-dev libproc2-dev libcmocka-dev gcovr
      - name: Configure CMake
        run: cmake -B build -DENABLE_TESTS=ON -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Generate coverage report
        run: gcovr --root . build --cobertura coverage.xml --txt
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true  # An upload outage must not block merges
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          use_oidc: true
