name: Flatpak (best effort)

# Mirrors the sibling typiql-tauri/typiql project's flatpak.yml, which took
# ten real-CI iterations to get working -- using that project's final,
# proven recipe from the start here rather than rediscovering the same
# bugs: a newer flatpak-builder from ppa:flatpak/stable (Ubuntu 22.04's
# default apt package predates GNOME/freedesktop Sdk 25.08 dropping the
# legacy appstream-compose binary in favor of appstreamcli).
#
# VERIFIED LOCALLY (2026-08-30): built end-to-end via a real local
# flatpak-builder run, then installed and ran the resulting bundle --
# `monocoque --help` and `gmonocoque` (correctly failing only on "cannot
# open display" in a headless test environment) both actually execute.
# Getting there found several real, monocoque-specific bugs beyond the
# ones typiql's own iteration already covered -- see
# flatpak/io.github.spacefreak18.monocoque.yml's inline comments for each:
# CMake-minimum-version issues in old vendored CMakeLists.txt files
# (libconfig, argtable2, hidapi), argtable2's 2011-era code needing
# -Wno-error=implicit-function-declaration for modern GCC, two git
# submodules (simapi, nappgui_src) the `dir` source doesn't pull in, a
# missing libuv dependency, a genuine upstream CMakeLists.txt bug in
# libproc2 version detection (an "UNKNOWN" pkg-config version string
# silently picked the wrong API), a stray always-on scratch test
# executable (simlighttest) with its own pre-existing link bug, /app/lib
# not being on the linker's default search path (needs LIBRARY_PATH, not
# CMAKE_EXE_LINKER_FLAGS -- ordering matters), argtable2 needing to build
# shared rather than static to avoid link-order sensitivity, and the real
# monocoque.svg icon being non-square (100x50), which Flatpak's export
# rejects outright.
#
# NOT YET VERIFIED: a real GitHub Actions run (this workflow itself,
# rather than the manifest run directly via flatpak-builder), and real
# hardware -- HID/serial/USB device access under Flatpak's sandbox is a
# known risk area untested here.
on:
  push:
    tags: ['*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      # No submodules: recursive here -- the manifest fetches simapi and
      # nappgui_src itself as explicit `type: git` sources (pinned commits,
      # reproducible regardless of what's checked out on disk). Confirmed
      # via a failed CI run: recursive submodule checkout here populates
      # those paths with real .git files first, which then collides with
      # flatpak-builder's own git source trying to clone into the same
      # spot ("cannot overwrite non-directory .git with directory").
      # Local testing never hit this because a plain worktree checkout
      # (what was actually tested against) doesn't fetch submodules by
      # default either.
      - uses: actions/checkout@v4

      - name: Install flatpak-builder + freedesktop runtime/SDK
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      # No offline-source generation step, unlike typiql's npm+cargo setup --
      # flatpak-builder downloads these plain upstream tarball sources
      # directly during the build.
      - name: Build .flatpak
        working-directory: flatpak
        run: |
          flatpak-builder --force-clean --repo=repo build-dir io.github.spacefreak18.monocoque.yml
          flatpak build-bundle repo monocoque.flatpak io.github.spacefreak18.monocoque

      - name: Upload .flatpak as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: monocoque.flatpak
          path: flatpak/monocoque.flatpak

      - name: Upload .flatpak to the matching (draft) release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: flatpak/monocoque.flatpak
          draft: true
